# Local stack: web (nginx + static build, proxies /api) -> api (Fastify) -> Fake Store,
# with Mailpit catching outgoing email. Ports bind to 127.0.0.1 only.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # Container-specific overrides of .env (which targets `npm run dev` on the host).
      # Local stack, not production: production config requires TLS for SMTP, and Mailpit
      # has none (see README "Environment variables").
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: '3000'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      TRUST_PROXY_HOPS: '1'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      mailpit:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      # Host port is overridable if 8080 is taken; add the new origin to ALLOWED_ORIGINS too.
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - '127.0.0.1:8025:8025' # web UI
      - '127.0.0.1:1025:1025' # SMTP (used by `npm run dev` on the host)
    environment:
      MP_MAX_MESSAGES: '500'
    restart: unless-stopped
