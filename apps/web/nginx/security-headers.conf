# Included in every location that serves the web app. nginx drops inherited add_header
# directives inside any location that defines its own, so headers live in this one snippet.
# The CSP matches the API's (apps/api/src/http/plugins/security.ts). Keep them in sync.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://fakestoreapi.com data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS is deliberately absent: locally this is plain HTTP. In production TLS terminates at
# CloudFront/ALB, which adds Strict-Transport-Security (see SECURITY.md).
